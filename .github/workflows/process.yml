name: process inbox

on:
  schedule:
    # Hourly, not every 15 min: private-repo Actions minutes are metered, and 96
    # runs/day would blow through the free allowance. Use "Run workflow" for now.
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Reprocess every Inbox row, ignoring the processed flags'
        type: boolean
        default: false
      flatten:
        description: 'Repair only: strip line breaks from existing rows, then stop'
        type: boolean
        default: false
      relabel:
        description: 'Repair only: fill the label column on existing pins, then stop'
        type: boolean
        default: false
      redescribe:
        description: 'Repair only: rewrite every description from a fresh web search'
        type: boolean
        default: false

concurrency:
  group: process-inbox
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pipx install yt-dlp
      - run: npm install --no-audit --no-fund
      - run: node process.js --selfcheck
      - run: node process.js ${{ inputs.flatten && '--flatten' || '' }} ${{ inputs.relabel && '--relabel' || '' }} ${{ inputs.redescribe && '--redescribe' || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          NOMINATIM_EMAIL: ${{ secrets.NOMINATIM_EMAIL }}
          FORCE: ${{ inputs.force && '1' || '' }}
